import groovy.json.JsonSlurper

import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.util.zip.ZipFile

plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// ---------------------------------------------------------------------------
// Prebuilt dependencies.
//
// The upstream project consumed SHA and Zemlya through composite builds
// (includeBuild '../SHA' / '../Zemlya') and nested them into the mod jar with
// Loom's `include` configuration. Composite builds cannot work here because
// those projects are separate repositories, so the same jar-in-jar bundling is
// done from the prebuilt jars in libs/.
//
// IMPORTANT: Loom 1.15 refuses to nest plain file dependencies -
//   "Attempted to nest artifact sha.jar which is not a module component and has
//    no capabilities" (NestableJarGenerationTask)
// - so every jar that has to be bundled is first staged into
// build/nestedRepo under its real <modid>-<version>.jar name and then consumed
// through the flatDir repository below as a normal module dependency.
//
// sodium and punchy stay compile-only: they are ordinary external mods that the
// player installs, they must NOT be bundled.
// ---------------------------------------------------------------------------
def shaJar = file("libs/sha.jar")
def zemlyaJar = file("libs/zemlya.jar")

// libs/zemlya-1.0.0.jar is an OLD build (made from Zemlya's src_legacy): its
// com.example.api.GravityChanger has no isInfected(), infect(),
// getInfectedGravity() or setGravityAnomalyStrength(), and
// com.example.api.GravityAnomalyZone does not exist there at all. It is
// therefore never used. Put an up-to-date build at libs/zemlya.jar to have it
// bundled; otherwise the API is compiled from zemlya-api/java and the Zemlya
// mod has to be installed separately.
def bundleZemlya = zemlyaJar.exists()

def nestedRepoDir = layout.buildDirectory.dir("nestedRepo").get().asFile

// Reads id/version from a mod jar's own fabric.mod.json.
def readModMeta = { File jar ->
	try {
		new ZipFile(jar).withCloseable { zip ->
			def entry = zip.getEntry("fabric.mod.json")
			if (entry == null) {
				return null
			}
			def json = new JsonSlurper().parse(zip.getInputStream(entry))
			if (!json.id || !json.version) {
				return null
			}
			return [id: json.id as String, version: json.version as String]
		}
	} catch (Exception e) {
		logger.error("Could not read fabric.mod.json from ${jar}: ${e.message}")
		return null
	}
}

// Copies a jar into build/nestedRepo as <id>-<version>.jar and returns the
// dependency notation for it (flatDir ignores the group).
def stageForNesting = { File jar ->
	if (!jar.exists()) {
		return null
	}
	def meta = readModMeta(jar)
	if (meta == null) {
		logger.error("ERROR: ${jar} has no usable fabric.mod.json, it cannot be bundled into the mod jar.")
		return null
	}
	nestedRepoDir.mkdirs()
	def staged = new File(nestedRepoDir, "${meta.id}-${meta.version}.jar")
	if (!staged.exists() || staged.length() != jar.length() || staged.lastModified() < jar.lastModified()) {
		Files.copy(jar.toPath(), staged.toPath(), StandardCopyOption.REPLACE_EXISTING)
	}
	logger.lifecycle("jar-in-jar: ${jar.name} -> ${meta.id}:${meta.version}")
	return "nested:${meta.id}:${meta.version}"
}

def nestedDependencies = [stageForNesting(shaJar), bundleZemlya ? stageForNesting(zemlyaJar) : null]
		.findAll { it != null }

repositories {
	mavenLocal()
	mavenCentral()
	maven { url = 'https://maven.wispforest.io/releases' }
	maven { url = 'https://jitpack.io/' }
	maven { url = 'https://api.modrinth.com/maven' }
	// Gives the staged jars proper module coordinates so Loom can nest them.
	flatDir { dirs = [nestedRepoDir] }
}

loom {
	accessWidenerPath = file("src/main/resources/nostalgia.accesswidener")
	mixin {
		useLegacyMixinAp = false
		defaultRefmapName = "nostalgia-refmap.json"
	}

	mods {
		"nostalgia" {
			sourceSet sourceSets.main
		}
	}

	runs {
		datagen {
			server()
			name "Data Generation"
			vmArg "-Dfabric-api.datagen"
			vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
			vmArg "-Dfabric-api.datagen.modid=nostalgia"
			vmArg "-Dfabric.addGameVersion=26.1.1"
			ideConfigGenerated = true
			runDir "build/datagen"
		}
	}
}

sourceSets {
	main {
		java {
			// Fallback only: used when libs/zemlya.jar is not present.
			if (!bundleZemlya) {
				srcDirs += ['zemlya-api/java']
			}
		}
		resources {
			srcDirs += [
					'src/main/generated'
			]
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// mappings are not needed for unobfuscated Minecraft 26.1.1
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. Using modApi so all Fabric classes (DimensionRenderingRegistry etc.) are on compile classpath.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Compile classpath. Minecraft 26.1.x is unobfuscated and
	// fabric.loom.disableObfuscation=true is set in gradle.properties, so plain
	// file dependencies need no remapping.
	compileOnly files(shaJar)
	compileOnly files("libs/sodium.jar", "libs/punchy.jar")
	if (bundleZemlya) {
		compileOnly files(zemlyaJar)
	}

	// jar-in-jar: bundled into build/libs/alpha_protocol-*.jar under META-INF/jars,
	// so a single file in the mods folder is enough, like in the original build.
	nestedDependencies.each { notation ->
		include notation
	}
}

processResources {
	inputs.property "version", project.version
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
	
	exclude "**/* *.ogg"
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

jar {
	inputs.property "archivesName", project.base.archivesName

	// When Zemlya is bundled, the real mod jar provides com.example.**.
	// When it is not, the API compiled from zemlya-api/java must not shadow the
	// implementation of a separately installed Zemlya mod.
	if (!bundleZemlya) {
		exclude 'com/example/**'
	}

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}

tasks.register('deploy') {
	doLast {
		def userHome = System.getProperty("user.home")
		def deployDirs = [
			System.getenv("MOD_DEPLOY_DIR"),
			"${userHome}/AppData/Roaming/PrismLauncher/instances/gundonio/minecraft/mods",
			"${userHome}/AppData/Roaming/PrismLauncher/instances/26.1.2(1)/minecraft/mods"
		].findAll { it != null && file(it).exists() }
		deployDirs.each { targetDir ->
			copy {
				from(layout.buildDirectory.dir("libs"))
				include("*.jar")
				exclude("*-sources.jar", "*-dev.jar", "*-sources-dev.jar")
				into(targetDir)
			}
		}
	}
}

build.configure {
	finalizedBy(deploy)
}

// Make missing prebuilt jars obvious instead of failing with hundreds of
// "package net.sha does not exist" errors.
gradle.projectsEvaluated {
	["libs/sha.jar", "libs/sodium.jar", "libs/punchy.jar"].each { p ->
		if (!file(p).exists()) {
			logger.error("ERROR: ${p} is missing. Put the prebuilt jar there before building (see README-BUILD-RU.md).")
		}
	}
	if (!bundleZemlya) {
		logger.warn("Zemlya: libs/zemlya.jar not found - compiling the API from zemlya-api/java. " +
			"The Zemlya mod will have to be installed separately, or drop an up-to-date build at libs/zemlya.jar to bundle it.")
	}
}
