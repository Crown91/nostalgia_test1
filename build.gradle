plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenLocal()
	mavenCentral()
	maven { url 'https://maven.wispforest.io/releases' }
	maven { url 'https://jitpack.io/' }
	maven { url 'https://api.modrinth.com/maven' }
}

loom {
	accessWidenerPath = file("src/main/resources/nostalgia.accesswidener")
	mixin {
		useLegacyMixinAp = false
		defaultRefmapName = "nostalgia-refmap.json"
	}

	mods {
		"nostalgia" {
			sourceSet sourceSets.main
		}
	}

	runs {
		datagen {
			server()
			name "Data Generation"
			vmArg "-Dfabric-api.datagen"
			vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
			vmArg "-Dfabric-api.datagen.modid=nostalgia"
			vmArg "-Dfabric.addGameVersion=26.1.1"
			ideConfigGenerated = true
			runDir "build/datagen"
		}
	}
}

sourceSets {
	main {
		// zemlya-api/java holds the three public Zemlya API types (com.example.api.*).
		// The prebuilt libs/zemlya-1.0.0.jar is an older build that lacks the gravity
		// infection / anomaly API this mod uses, so the API is compiled from source here
		// and excluded from the produced jar (see the jar task below).
		java {
			srcDirs += [
					'zemlya-api/java'
			]
		}
		resources {
			srcDirs += [
					'src/main/generated'
			]
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// mappings are not needed for unobfuscated Minecraft 26.1.1
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. Using modApi so all Fabric classes (DimensionRenderingRegistry etc.) are on compile classpath.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	// SHA is consumed as a prebuilt jar from libs/ instead of a composite build,
	// so this repository can be built standalone (see README-BUILD-RU.md).
	// Minecraft 26.1.x is unobfuscated and fabric.loom.disableObfuscation=true is set in
	// gradle.properties, so plain file dependencies need no remapping.
	compileOnly files("libs/sha.jar")
	compileOnly files("libs/sodium.jar", "libs/punchy.jar")
	// NOTE: libs/zemlya-1.0.0.jar is intentionally NOT on the compile classpath.
	// It is stale: com.example.api.GravityChanger there has no isInfected(), infect(),
	// getInfectedGravity(), setGravityAnomalyStrength(), and com.example.api.GravityAnomalyZone
	// does not exist at all. zemlya-api/java provides the current API instead.
}

processResources {
	inputs.property "version", project.version
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
	
	exclude "**/* *.ogg"
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

jar {
	inputs.property "archivesName", project.base.archivesName

	// The Zemlya API classes are provided at runtime by the Zemlya mod itself.
	// Shipping our own copies would shadow the real implementation.
	exclude 'com/example/**'

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}

tasks.register('deploy') {
	doLast {
		def userHome = System.getProperty("user.home")
		def deployDirs = [
			System.getenv("MOD_DEPLOY_DIR"),
			"${userHome}/AppData/Roaming/PrismLauncher/instances/gundonio/minecraft/mods",
			"${userHome}/AppData/Roaming/PrismLauncher/instances/26.1.2(1)/minecraft/mods"
		].findAll { it != null && file(it).exists() }
		deployDirs.each { targetDir ->
			copy {
				from(layout.buildDirectory.dir("libs"))
				include("*.jar")
				exclude("*-sources.jar", "*-dev.jar", "*-sources-dev.jar")
				into(targetDir)
			}
		}
	}
}

build.configure {
	finalizedBy(deploy)
}

// Make missing prebuilt jars obvious instead of failing with hundreds of
// "package net.sha does not exist" errors.
gradle.projectsEvaluated {
	["libs/sha.jar", "libs/sodium.jar", "libs/punchy.jar"].each { p ->
		if (!file(p).exists()) {
			logger.error("ERROR: ${p} is missing. Put the prebuilt jar there before building (see README-BUILD-RU.md).")
		}
	}
}
