name: build-jar

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      # The SHA jar can be committed under any name (libs/sha.jar,
      # libs/sha-1.0.7.jar, ...), or pulled automatically from the latest
      # successful build of Crown91/sha_test (needs the SHA_TEST_TOKEN secret:
      # a fine-grained PAT with Actions: read + Contents: read on sha_test).
      - name: fetch patched sha jar from sha_test
        env:
          GH_TOKEN: ${{ secrets.SHA_TEST_TOKEN }}
        run: |
          set -e
          shopt -s nullglob
          existing=(libs/sha*.jar)
          if [ ${#existing[@]} -gt 0 ]; then
            echo "already present: ${existing[*]}"
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::no libs/sha*.jar and secret SHA_TEST_TOKEN is not set; upload the jar into libs/ manually"
            exit 0
          fi
          run_id=$(gh run list -R Crown91/sha_test --workflow build-jar --status success -L 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::warning::no successful build-jar run found in Crown91/sha_test"
            exit 0
          fi
          echo "downloading artifact sha-mod-jar from run $run_id"
          gh run download "$run_id" -R Crown91/sha_test -n sha-mod-jar -D /tmp/shaart
          jar=$(find /tmp/shaart -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          if [ -z "$jar" ]; then
            echo "::error::artifact sha-mod-jar contains no mod jar"
            exit 1
          fi
          mkdir -p libs
          cp "$jar" libs/sha.jar
          echo "libs/sha.jar <- $jar"

      - name: check inputs
        run: |
          set -e
          shopt -s nullglob
          missing=0

          sha_jars=(libs/sha*.jar)
          if [ ${#sha_jars[@]} -gt 0 ]; then
            SHA_JAR="${sha_jars[-1]}"
            echo "ok: $SHA_JAR ($(stat -c%s "$SHA_JAR") bytes)"
            echo "SHA_JAR=$SHA_JAR" >> "$GITHUB_ENV"
          else
            echo "::error::no libs/sha*.jar found. Upload the SHA jar into libs/ (see README-BUILD-RU.md)"
            missing=1
          fi

          for f in libs/sodium.jar libs/punchy.jar; do
            if [ -f "$f" ]; then
              echo "ok: $f ($(stat -c%s "$f") bytes)"
            else
              echo "::error::$f is missing. Upload it into libs/ (see README-BUILD-RU.md)"
              missing=1
            fi
          done

          # Zemlya is chosen by content: a build without isInfected() in
          # com.example.api.GravityChanger is an old src_legacy build and is skipped.
          zemlya_ok=""
          for z in libs/zemlya*.jar; do
            if unzip -p "$z" 'com/example/api/GravityChanger.class' 2>/dev/null | grep -qa 'isInfected'; then
              zemlya_ok="$z"
            else
              echo "::warning::$z has no isInfected() in com.example.api.GravityChanger - outdated build, ignored"
            fi
          done
          if [ -n "$zemlya_ok" ]; then
            echo "ok: $zemlya_ok ($(stat -c%s "$zemlya_ok") bytes) - will be bundled (jar-in-jar)"
          else
            echo '::warning::no up-to-date Zemlya build in libs/: the API will be compiled from zemlya-api/java and the Zemlya mod will have to be installed separately'
            if [ ! -d zemlya-api/java ]; then
              echo '::error::neither an up-to-date libs/zemlya*.jar nor zemlya-api/java exists'
              missing=1
            fi
          fi

          if [ ! -d src/main/java ]; then
            echo '::error::src/main/java is missing'
            missing=1
          fi
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::error::gradle/wrapper/gradle-wrapper.jar is missing (binary file, must be committed)"
            missing=1
          fi
          [ "$missing" = "0" ]

      - name: verify the sha jar is the patched arm64 build
        run: |
          set -e
          if unzip -l "$SHA_JAR" | grep -q 'assets/sha/bin/android-arm64/sha_rapier.so'; then
            echo "ok: $SHA_JAR contains the aarch64 native library"
          else
            echo "::warning::$SHA_JAR has no assets/sha/bin/android-arm64/sha_rapier.so - this looks like the original jar, not the patched one."
          fi

      - name: setup java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: gradle build
        run: |
          chmod +x gradlew || true
          ./gradlew build --no-daemon --stacktrace

      - name: verify bundled (nested) mod jars
        if: success()
        run: |
          set -e
          for j in build/libs/*.jar; do
            case "$j" in *-sources.jar|*-dev.jar) continue;; esac
            echo "--- $j"
            unzip -l "$j" | grep 'META-INF/jars/' || echo '::warning::no nested jars found'
          done

      - name: upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nostalgia-mod-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/reports/**
            build/tmp/**/*.log
            hs_err_pid*.log
          retention-days: 7
          if-no-files-found: ignore
