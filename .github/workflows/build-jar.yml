name: build-jar

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      # libs/sha.jar can be committed manually, or pulled automatically from the
      # latest successful build of Crown91/sha_test (needs the SHA_TEST_TOKEN secret:
      # a fine-grained PAT with Actions: read + Contents: read on sha_test).
      - name: fetch patched sha.jar from sha_test
        if: ${{ hashFiles('libs/sha.jar') == '' }}
        env:
          GH_TOKEN: ${{ secrets.SHA_TEST_TOKEN }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::libs/sha.jar is absent and secret SHA_TEST_TOKEN is not set; upload libs/sha.jar manually"
            exit 0
          fi
          run_id=$(gh run list -R Crown91/sha_test --workflow build-jar --status success -L 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::warning::no successful build-jar run found in Crown91/sha_test"
            exit 0
          fi
          echo "downloading artifact sha-mod-jar from run $run_id"
          gh run download "$run_id" -R Crown91/sha_test -n sha-mod-jar -D /tmp/shaart
          jar=$(find /tmp/shaart -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          if [ -z "$jar" ]; then
            echo "::error::artifact sha-mod-jar contains no mod jar"
            exit 1
          fi
          mkdir -p libs
          cp "$jar" libs/sha.jar
          echo "libs/sha.jar <- $jar"

      - name: check inputs
        run: |
          set -e
          missing=0
          for f in libs/sha.jar libs/sodium.jar libs/punchy.jar; do
            if [ -f "$f" ]; then
              echo "ok: $f ($(stat -c%s "$f") bytes)"
            else
              echo "::error::$f is missing. Upload it into libs/ (see README-BUILD-RU.md)"
              missing=1
            fi
          done
          for d in src/main/java zemlya-api/java; do
            if [ -d "$d" ]; then
              echo "ok: $d"
            else
              echo "::error::$d is missing"
              missing=1
            fi
          done
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::error::gradle/wrapper/gradle-wrapper.jar is missing (binary file, must be committed)"
            missing=1
          fi
          [ "$missing" = "0" ]

      - name: verify sha.jar is the patched arm64 build
        run: |
          set -e
          if unzip -l libs/sha.jar | grep -q 'assets/sha/bin/android-arm64/sha_rapier.so'; then
            echo 'ok: libs/sha.jar contains the aarch64 native library'
          else
            echo '::warning::libs/sha.jar has no assets/sha/bin/android-arm64/sha_rapier.so - this looks like the original jar, not the patched one.'
          fi

      - name: setup java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: gradle build
        run: |
          chmod +x gradlew || true
          ./gradlew build --no-daemon --stacktrace

      - name: check that Zemlya API classes are not shipped
        if: success()
        run: |
          set -e
          for j in build/libs/*.jar; do
            case "$j" in *-sources.jar) continue;; esac
            if unzip -l "$j" | grep -q 'com/example/'; then
              echo "::warning::$j contains com/example classes; they should be provided by the Zemlya mod at runtime"
            else
              echo "ok: $j ships no com/example classes"
            fi
          done

      - name: upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nostalgia-mod-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/reports/**
            build/tmp/**/*.log
            hs_err_pid*.log
          retention-days: 7
          if-no-files-found: ignore
